      files: ["ValueGate.cs", "MergePolicy.cs"]
      problem: |
        · GetDefaultState 取默认模板失败（如 PlayerStore.Instance 暂为 null）时返回 null，
          AtDefaultState 把「模板不可用」与「该物品无关键 tag」混为一谈 ⇒ `defaults == null` 直接
          `return true`（放行）⇒ 整道值域闸门对该物品【静默跳过】（fail-open），
          与文件头『异常 → 置 FaultProtection 并返回 false』的承诺相反，会重新引入拆分污染。
        · MergePolicy 的值域块把 `ConsumeJudgeFault` 放在 `!AtDefaultState` 分支【内】——
          一旦判据「置了故障位却返回 true」，该位会残留并污染下一个判据（误报 mp.fault.blacklist 拦截）。
      fix: |
