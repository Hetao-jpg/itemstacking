# ============================================================================
# 四、与 MergeSteerer 的边界（v2 决策的落地复核）
# ============================================================================
deny_vs_steer_recheck:
  decision: "机器容器 → MergePolicy.Deny（数据保护）；不进 MergeSteerer"
  code_evidence:
    - "MergePolicy.cs:107-110 注释明确『完全禁止合并（数据保护），不走 ShouldSteerToEmptySlot』"
    - "MergeSteerer.cs ShouldSteerToEmptySlot 只覆盖：配对快移(Alt/Shift) / AltTransferScope / 柜台"
  consistency_check:
    - question: "机器 Deny 后，原生如何继续？（会不会变成『不合并也不填充』？）"
      answer: |
        不会。Deny 只作用于 MayStack/GetStackSlot（返 false）。
        原生 `TryFindOneValidInventorySlot` 对候选堆调 MayStack；false → `je loop_top`（跳过该候选）
        → 最终落到它自己的【空槽分支】。这正是 v2 §二 NC1/NC2 的机制。
        资料库 §8.2 已实锤：EndDrag 路径 1 = `MayPlayerInsertInto → TryFindOneValidInventorySlot
        → TryAcceptOnce（×≤40 次循环）`——自动填充的循环在【路径 1】，不在 Deny 所封的路径 2。
  cross_path_coverage:
    title: "各合并路径是否都被机器 Deny 覆盖（防绕过）"
    rows:
      - path: "鼠标拖放（EndDrag 路径2 堆叠分支）"
        gate: "MayStack / GetStackSlot → MergePolicy"
        covered: true
      - path: "Alt 快移 / Shift 配对（自写 Prefix → GraphUtils.TryAcceptOnce）"
        gate: "TryAcceptOnce 内部逐格循环 → TryFindOneValidInventorySlot → MayStack"
        covered: true
        note: "ModifierPairTransfer.cs TryAcceptOnceInto 走原生 GraphUtils.TryAcceptOnce，故经 MayStack；非绕过"
      - path: "Ctrl 快移（CtrlTransferScope 闸门）"
        gate: "Patch_SlotMarkerTryAcceptOnce 阶段1 → GetMergeGateReason"
        covered: true
      - path: "Alt 配对 noMerge 模式"
        gate: "MergeSteerer.ShouldSteerToEmptySlot 返 true（导流）"
        covered: true
        note: "导流 = MayStack false → 空槽；与机器 Deny 同向，不冲突"
      - path: "★ 落点抬升（GameGridInventory 硬编码 numTransfer=1 → 抬到 StackCap）"
        gate: "0.13.0 起加了 `!IsMachineContainer(...)` 排除（防御性加固，见 StackPatches.AltTransfer.cs 非 Alt 分支）"
        covered: true
        note: |
          该段直接改写 numTransfer，【绕过 MaxNumAdd 钳制】。机器容器正常是 GameSlotInventory
          （本补丁只挂 GameGridInventory 实现）⇒ 默认不触发；加排除是为防「机器容器改用
          GameGridInventory」时一次拖拽把多件塞进机器一格。属纵深防御。
  conclusion: |
    ⚠️ 【2026-10-13 被实机证伪，见 §十一】原结论「上述路径无一绕过机器 Deny」不成立：
    用户实测 Ctrl+鼠标点击快移 与 Ctrl+鼠标拖动 都能把整堆塞进熔炉的同一个格子。
    本节的『covered: true』只在【判据被正确执行且容器被识别】的前提下成立；
    实机表明这两个前提至少有一个不成立。以 §十一 为准。

# ============================================================================
# 五、★ v3 新增：白名单 × 机器名单重叠分析（v2 未覆盖）
# ============================================================================
whitelist_machine_overlap:
  why_it_matters: |
    v2 的 R7 说「机器容器若不在白名单，玩家本来就放不进去堆叠物品——本方案对这类容器无实际作用」。
    该说法【只对『合并』成立，对『放置』不成立】，需要更正：
      · 放置（target == null）在 MergePolicy 第一步 `if (ctx.target == null) return Allow` 就放行了，
        【不看白名单】；而容量层 MaxNumAdd 的空槽分支会把 numTransfer 抬到 StackCap。
      · ⇒ 在本方案之前，往【任何】机器容器的空槽拖 N 件，会被抬到 StackCap(默认 10) ⇒ 一次塞进一格
        —— 这才是 DestroyFix 系列崩坏（机器假设一槽一实例）的默认数据通路。
      · ⇒ 本方案的 MaxNumAdd 钳 1 对【所有】机器容器默认生效（与白名单无关）；
        Deny 则补上「不与已有堆合并」。所以本功能【默认即生效，且不依赖白名单】。

  overlap:
    token: "owner:bottle_printer"
    in_whitelist: true
    in_machine_list: true
    whitelist_source: "Main.cs DefaultContainerWhitelist（17 项 owner: 之一）"
    machine_source: "BuiltinBlacklist.cs DefaultMachineContainerTokens"
    functional_effect: "惰性（无实际差别）"
    analysis: |
      · 合并：机器 Deny 在 Evaluate 的【0.5 步】、白名单在【第 4 步】⇒ 机器命中即 Deny，白名单永不参与。
      · 放置：Evaluate【第 0 步】就 Allow，白名单同样不参与。
      ⇒ 对 bottle_printer 而言，它是否在白名单里【不改变任何行为】——该白名单条目是「死配置」。
      它唯一的作用面是：若玩家用 JSON `machineContainers: []` 显式关闭机器拦截，
      该条目会重新变成「允许在瓶子里合并」的活配置。
    v2_proposal_recap: |
      v2 之前的《优化实施方案.md》批1 §五 决定「机器容器靠白名单排除、不写新补丁」——
      由本节 analysis 可见：那只挡了『合并』、挡不住『放置』，故 v2 的机器钳制是本项目真正补上的那块。
    disposition:
      - "决定：保留 owner:bottle_printer 白名单条目（不改默认行为；避免动用户可见默认值）"
      - "已做（文档层）：Main.cs 启动提示由『机器容器请勿加入白名单』更正为
         『机器已由机器容器名单单独拦截，写入白名单也不会堆叠』"
      - "已做（文档层）：Config.cs DefaultContainerWhitelist 旁加注说明其与机器名单的交叠与惰性"
      - "已做（注释层）：MergePolicy 回滚开关注释 + cfg z9 描述补上『关掉 new 路径会失去机器 Deny』"
      - "可选（待实机）：确认水瓶打印机里『拖 N 件 → 逐格铺开』符合玩家预期（见 §7 TC-BP）"

  other_whitelisted_machines: "无。其余 12 项机器 token 均不在默认白名单。"

# ============================================================================
# 六、风险台账（v2 R1–R8 的现状）
# ============================================================================
risk_ledger:
  - id: R1
    name: "EndDrag 循环触发条件不确定（拖到格子 vs 拖到背景）"
    v2_severity: high
    current_status: "仍待实机验证（唯一未闭环项）"
    offline_finding: |
      资料库 §8.2 已实锤：×≤40 次循环属【路径 1 普通放置】（MayPlayerInsertInto →
      TryFindOneValidInventorySlot → TryAcceptOnce 循环）。机器 Deny 令 MayStack=false，
      正是把原生推向这条路径 —— 机制上自洽。
      ⇒ 结论：只要「拖到机器容器的某个格子」使 hoverElement = 该格，路径 1 即触发，
        自动填充成立；「拖到容器背景/标题」是否同样进入路径 1，需实机确认。
    mitigation_in_code: "无（机制层面已自洽；若实机显示需更强填充，再评估 EndDrag Postfix 自写循环）"
    residual_action: "见 §7 TC1–TC3"

  - id: R2
    name: "快捷转移单次调用（Alt 快移只放 1 件）"
    v2_severity: medium
    current_status: "已按 v2 决定【接受现状】"
    detail: |
      Alt/Shift 配对快移走原生 GraphUtils.TryAcceptOnce（内部逐格循环），并非「单次」——
