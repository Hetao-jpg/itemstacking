ctrl_bypass_resolution:
  status: "已修复（2026-10-13 00:31 构建，00:33 部署；实机复测待用户执行）"

  decisive_log:
    source: "用户 2026-10-13 00:29 实测日志（Ctrl+拖动 scrap_metal ×10 到熔炉）"
    key_line: |
      [落点观测·放置] 整堆入【空槽】候选：scrap_metal ×10，
        容器=id=<空id>  类=GameGridInventory  槽位=<不在EmporiumEntry内>
        所属=furnace  内含=<空>，机器判据=False，marker.numTransfer=10
    readings:
      - "出现本行 ⇒ Ctrl 路径【确实】经 SlotMarker.TryAcceptOnce ⇒ H2 排除；本层钳量有效（快移也受控）。"
      - "`所属=furnace` ⇒ owner 链【能】取到机器物品 ⇒ H1 排除；F6 的假设成立，名单机制本身没问题。"
      - "`机器判据=False` ⇒ IsMachineContainer 明明该 true 却返回 false ⇒ 判据被跳过。"
      - "`marker.numTransfer=10` ⇒ MaxNumAdd 的机器钳 1 也没生效，空槽分支把它抬到了 StackCap(10)。"

  root_cause:
    one_line: "★ 不是原设计缺陷，而是 2026-10-13 本轮『热路径惰性取值』优化里的一句提前 return —— 把纯 owner: 名单整条裁掉。"
    detail: |
      `IsContainerInTokens` 当时写成：
          ScanTokenNeeds(...);                      // 扫出 needId / needSlot
          if (!needId && !needSlot) return false;   // ← 罪证：当成"空名单才返回 false"
          ...
      而 `owner:` token 【既不消费 id 也不消费 slot】⇒ 机器容器名单（13 项全是 owner:）
      必然落进 (false,false) ⇒ 直接 return false ⇒ 永远「不命中」。
    impact:
      - "机器容器拦截两层（MergePolicy Deny + MaxNumAdd 钳 1）【同时静默失效】⇒ 整堆进机器一格。"
      - "连带（同源、同样严重）：只填 owner: 的自定义 ContainerWhitelist 会「全不命中」⇒ 那些容器里堆叠整体失效。（含 slot: 的默认白名单不走这一档，故默认配置察觉不到 —— 典型的静默失效面。）"
    why_missed: |
      纯函数测不到调用方（IsContainerInTokens 需 il2cpp 的 GameInventory），
      当时的 3 个单测只覆盖了名单数据层（DefaultMachineContainerTokens 内容），
      没有覆盖「纯 owner: 列表 → 命中」这条判定路径 ⇒ 回归无声通过。

  fix:
    files: ["StackGates.cs", "Constants.cs"]
    design: |
      · 把【命中判定】提成纯函数 `internal static bool AnyTokenMatches(tokens, id, slot, ownerMatch)`：
        三路（裸 id / slot: / owner:）在【同一个循环】里逐条评估，结构上不存在"提前 return"。
      · `ScanTokenNeeds` 只保留「本次是否需要取 id / slot」这一件事，并在注释里写明
        「它只决定取值，不决定命中」。
      · `IsContainerInTokens` = 扫描 → 按需取 id/slot → 交 AnyTokenMatches。
        ⇒ 键点：**只允许把「取值」变懒，绝不允许裁剪「评估」**。
      · 删除 `MatchesContainerToken(string, GameInventory, ...)`（逻辑并入 AnyTokenMatches，
        与 GameInventory 解耦后即可单测 —— 这正是它当初躲过测试的原因）。
    regression_guard:
      - "新增 `_tests/ItemStacking.Tests/ContainerTokenMatchTests.cs`（11 例）：
         ScanTokenNeeds 各路取值矩阵；AnyTokenMatches 三路命中；**纯 owner: 名单 + owner 命中 ⇒ true**；
         用【真实 DefaultMachineContainerTokens】+ id/slot 全 null 跑一遍（= 实机那一档）。"
      - "源码形状守门：断言 StackGates.cs（剥注释后）永不出现 `!needId && !needSlot) return false`，
         且必须调用 AnyTokenMatches —— 纯函数测不到调用方，故用形状断言补上这道闸。"
      - "测试总数 29 → 39。"

  consequences_for_the_three_options:
    OPT-1_alt_alignment: "仍不推荐（不覆盖 Ctrl+拖动）。"
    OPT-2_non_whitelist_one_per_slot: |
      ★ 结论：**不需要做**。它当初的动机是"名单可能识别不到机器"；现已证实名单机制有效
      （owner: 链可达 furnace）。而 OPT-2 附带"余量可能被回收"的不可知丢件风险 ⇒
      在 OPT-3（名单/补判据）已足够的前提下，不做才是对的（合乎项目「不可知风险的方法默认不用」）。
    OPT-3_tag_based_identification: |
      仍然【可选】：当玩家装【本作之外的自定义机器】时，`STANDARD_MACHINE_TAG` 补判据能免去手配名单。
      但需配排除表（冰箱/充能器等储物型机器），且若该机器的内库 parent 链取不到物品则同样失效。
      ⇒ 优先级 P3，等有实际需求再加。

  pending_real_verification:
    - "熔炉/解序器：Ctrl+点击快移 与 Ctrl+拖动整堆 —— 期望日志变为 `机器判据=True`、`marker.numTransfer=1`，"
    - "且表现变为：整堆被逐格铺开（每格 1 件），余量留在源容器；机器内不再出现 unitCount>1。"
    - "顺带复测 §七 TC1/TC2/TC3/TC-BP（DiagLog 关掉跑一遍，确认无异常日志）。"

  side_finding:
    title: "副产物：状态比较耗时实测 56.94 µs（超过 L1 计划阈值 50 µs）"
    caveat: |
      ★ 该数值是在 DiagLog=true 下测得的，而 DiagLog 开时【判不等】路径会额外执行 DiagStateDiff，
      故测量值偏高、不能直接与 50 µs 阈值比。要下结论需在 DiagLog=false 下重测
      （但 DiagLog 关时 ReportStateCmpTiming 本身也被门控 —— 需临时改成"只测不打日志"才可测）。
    action: "暂不动（沿用 L1 计划：先有可信数据再决定是否加缓存）。"




