ctrl_bypass_analysis:
  trigger: "用户实机反馈（2026-10-13 00:23，部署版本 = 本仓库 0.13.0 产物，md5 与 bin/Release 一致）"
  symptom: |
    【问题1】Ctrl + 鼠标左键点击快移（堆叠到目标窗口）、Ctrl + 鼠标拖动整堆
    —— 两条路径都能让整堆物品**绕过机器容器判据**，进入熔炉内部并在**同一个格子**里堆叠。
    即：v3 §四 的「四条路径无一绕过」结论被证伪。
  impact: "机器容器「一槽一实例」的硬前提被破坏 ⇒ 用户提出的【深层需求】：机器工作失常（原版不识别 unitCount>1）。"

  established_facts:
    title: "已确证的事实（有文档/反汇编出处，非推断）"
    facts:
      - id: F1
        fact: "`SlotMarker.TryAcceptOnce(amount)` 的数量语义 = `amount = min(amount<0?numTransfer:amount, numTransfer, MaxNumRemove)`；≤0 直接返回 0。"
        source: "游戏物品移动机制.md §3.2（0x7B0020）"
        implication: "「一次进一格多少件」= 这三个值的【最小值】⇒ 钳量必须落在其中一个上。"
      - id: F2
        fact: "EndDrag 兜底循环：`for(i<0x28/*40*/ && currentRemove>=1)` → `TryFindOneValidInventorySlot` → `SlotMarker.TryAcceptOnce(marker, currentRemove)`。"
        source: "游戏物品移动机制.md §5.1 路径 3"
        implication: "拖放路径（含 Ctrl+拖动整堆，currentRemove=整堆）走这里；每次循环放 min(currentRemove, numTransfer)。"
      - id: F3
        fact: "Ctrl 快捷转移（ItemQuickTransferHandler.OnEventRelease）**分三支**：① 命中标签 → FindChildrenType 逐项 → `GraphUtils.TryAcceptOnce`；② `CanInsertToActiveContainer` 为真 → `GraphUtils.InsertToActiveContainer`（返回 void）；③ 否则 → `GraphUtils.TryAcceptOnce`。"
        source: "游戏物品移动机制.md §5.2"
        implication: "Ctrl 路径有三个子分支，其中 ② 是「整件插入活动容器」，最可能是「整堆原样进一格」的通道。"
      - id: F4
        fact: "`GraphUtils.TryAcceptOnce / TryAcceptAll / InsertToActiveContainer / CanInsertToActiveContainer` 的**内部实现未反汇编**（原文标注 ❓）。"
        source: "游戏物品移动机制.md 末尾「未验证项」第 6 条"
        implication: |
          ⇒ 「Ctrl 是否真的经 `SlotMarker.TryAcceptOnce`」【离线无法定论】：
            本仓库另一处注释（StackGates.cs）称经它，而 §5.2 的措辞是「不走 SlotMarker」——
            两者都是推断。**这是决定修法的唯一未知量**。
      - id: F5
        fact: "机器（冰箱/瓶打印机/模块仓/动物笼/工具箱）的内库存是 `GameGridInventory`；机器物品带 `STANDARD_MACHINE_TAG`（标准机器标记，`MachineHelper::LoadUpgrade` 用它判机器）。"
        source: "游戏容器机制解析/容器清单.md §三 / §六"
        implication: |
          · 「机器 = 带 STANDARD_MACHINE_TAG 的物品」是一个【机器无关】的识别路，可作为名单的补充/替代；
          · 但它会把冰箱/充能器等「储物型机器」也纳入 ⇒ 与 v3 §三 有意排除项冲突（R8 回归风险）。
      - id: F6
        fact: "`MaxNumAdd` 的机器钳 1 只在 `IsMachineContainer(slot.inventory)` 为真时生效；`IsMachineContainer` 依赖 `owner:` 链（`inv.GetParentItem()` 上溯 ≤3 层）或裸 id 匹配。"
        source: "本仓库 BuiltinBlacklist.cs:155 / StackGates.cs:431"
        implication: |
          若机器内库的 `GetParentItem()` 链取不到 id=`furnace` 的物品（例如机器是【世界摆放物】、
          其内库不在任何物品的 parentInventory 之下），则 `owner:furnace` **永不命中** ⇒
          Deny 与钳 1 两层**同时静默失效** —— 与实机现象完全吻合。

  root_cause_hypotheses:
    title: "根因候选（按可能性排序，均需一条实机日志定死）"
    hypotheses:
      - id: H1
        name: "机器识别失败（最可能）"
        reasoning: "F6：owner: 链取不到 furnace ⇒ IsMachineContainer 恒 false ⇒ Deny 与钳 1 都不触发。实机'绕过层层判定'与此一致。"
        decide_by: "探针打印的『机器判据=false』+『容器=… 所属=<顶层容器>』"
      - id: H2
        name: "Ctrl 快移绕过 SlotMarker.TryAcceptOnce（分支② InsertToActiveContainer）"
        reasoning: "F3/F4：若 Ctrl 走 `InsertToActiveContainer`（void、直落 L1 UncheckedAccept），则任何挂在其后的判据都不会被调用。"
        decide_by: "复现时探针【看不到】`[落点观测·放置]` 行"
      - id: H3
        name: "数量由上游写死，钳不住"
        reasoning: "F1/F2：即使经 SlotMarker，若上游已把 numTransfer 写成整堆且 MaxNumRemove 也很大，则 min(...) 仍是整堆。"
        decide_by: "探针行的 numTransfer 数值"

  options:
    - id: OPT-1
      name: "思路1（用户提出）：把 Alt 快移的目标判定向 Ctrl 看齐，Alt 成为「可自定义数量（默认 1）」的快移键"
      feasibility: "中"
      feasibility_notes: |
        · 复用现有 Alt 配对快移基础设施（ModifierPairTransfer.cs：TryAcceptOnceInto / NativeTailCleanup /
          按键分派 / AltQuickTransferAmount）—— 已有骨架。
        · 缺的那块是【目标容器判定】：原生 Ctrl 用 RaycastElement + TreeNodeRender::FindParentWindow
          取"命中元素的父窗口"（§5.2 ②），本 mod 目前没有"按鼠标落点取窗口"的实现，
          需新增（挂点/字段待反汇编，属未验证面）。
        · 若改为"接管 Ctrl 键"（Patch ItemQuickTransferHandler.OnEventRelease 返回 false 自己搬），
          还要复刻 Ctrl 的三分支语义，否则会破坏 Ctrl 在非机器场景的正常手感。
      benefit: |
        · Alt 变成唯一"数量可控"的快移键 ⇒ **快移路径**不再可能一次塞多件；
        · 符合"把危险行为收敛到一个人可控的键"的直觉。
      risk: |
        · ⚠️ **不覆盖 Ctrl+拖动**：Ctrl+拖动走的是 EndDrag（与普通拖动同一条路径，只是 currentRemove=整堆），
          键级改造对它无效 ⇒ **需求 1 只解决一半**（这也是本方案最大的问题）。
        · 需要新写"落点窗口判定"，属未验证面；失败表现为 Ctrl 快移手感异常（比"堆叠进机器"更难回滚）。
        · 与 ContainerSuite 等同样占用 Alt 的 mod 冲突面扩大。
      verdict: "不推荐单独采用（解决不了 Ctrl+拖动）。可作为 OPT-2 之后的补充：把快移统一收到 Alt。"

    - id: OPT-2
      name: "思路2（推荐）：把「每格 1 件」下沉到公共瓶颈，并让【策略】按容器是否在白名单决定"
      feasibility: "高（改动小）、但有一处已知不可知风险"
      design: |
        A. 收窄点：`SlotMarker.TryAcceptOnce` 的 `amount`（或 `marker.numTransfer`）。
           · F1 表明：`amount = min(amount, numTransfer, MaxNumRemove)` ⇒ 把任一钳到 1 即「每格最多 1 件」。
           · 这是**唯一能同时盖住 Ctrl+点击 与 Ctrl+拖动**的机制（两者最终都调用它，见 F2）。
        B. 判据：`!IsContainerWhitelisted(落点容器)`（= 非白名单一律"每格 1 件 + 不合并"）。
           · 机器容器默认不在白名单 ⇒ 自动覆盖**所有机器**（含未知/扩展机器），不依赖名单完整度
             ⇒ 正面回答用户的【深层需求】。
           · 白名单容器行为逐字节不变（背包/仓储/柜台/展示柜照常堆叠）。
      benefit: |
        · 一次改动同时解决 问题1（Ctrl 两条路径）+ 深层需求（机器通用，不依赖名单）；
        · 白名单本就是"安全边界"的唯一语义入口，与既有架构一致（不新增概念）；
        · 无需先修 owner: 识别（H1 被绕过而不是被修）。
      risk: |
        · ⚠️ **不可知风险（必须先实测）**：`TryAcceptOnce` 被钳后走「部分移动」分支
          `GetSplitItem(item, 1)`（§3.2）⇒ 未被接受的余量**留在光标/源物品上**。
          EndDrag 清理段有 `if (item.parentInventory == null) → 回收/销毁` 虚调用
          （§5.1 清理）⇒ **理论上存在"余量被回收"的丢件路径**。这正是项目「0.10.1 踩过的坑」
          （在 TryAcceptOnce 层动结果会打断上层循环语义）的同类风险。
          ⇒ 未经实测【不能默认开启】。
        · 对"非白名单容器"改变了放置手感（整堆拖入会铺开成一格一件，余量留在光标）；
          需在 cfg 说明里写清，并提供回滚开关。
      verdict: "方向正确且最省事；但必须先在【诊断探针确认链路】之后，再做受控实测。"

    - id: OPT-3
      name: "思路3（兜底/补强）：修机器识别 —— owner: 之外增加机器无关的判据"
      feasibility: "中（识别路依赖 GetParentItem 是否可用）"
      design: |
        · 主判据：`owner:` 链（现状）。
        · 补判据：所属物品带 `STANDARD_MACHINE_TAG`（F5）⇒ 机器无关，覆盖扩展模组机器。
        · 但需叠加【排除表】把冰箱/充能器/真空机器人等「储物型机器」放行（沿用 v3 §三 的排除结论），
          否则会回归 R8（这些容器默认白名单在用、玩家确实在里面堆叠）。
      benefit: "不依赖 id 名单的完整度；能自动覆盖未来的新机器。"
      risk: |
        · 排除表又变成一份需要维护的名单（与"机器无关"的初衷部分抵消）；
        · 所有判据仍共用 `GetParentItem()` 这一前置依赖 —— 若 H1 的根因是它取不到机器物品，
          OPT-3 同样失效（所以 OPT-2 的"不依赖识别"更有价值）。
      verdict: "与 OPT-2 互补：OPT-2 负责「漏网的也不堆」，OPT-3 负责「已识别的连放都不让放」。"

  decisive_experiment:
    title: "★ 决定性实验（一条日志即可定案，零风险）"
    how: |
      1. cfg 打开 `DiagLog = true`，重启游戏。
      2. 复现两个动作：① Ctrl+左键点击 一叠物品快移到熔炉；② Ctrl+拖动一叠物品到熔炉。
      3. 抓日志里这两类行：
         · `[落点观测·放置] 整堆入【空槽】候选：… 容器=… 机器判据=… marker.numTransfer=…`
         · `机器容器内 MaxNumAdd 钳到 1：…`（若出现，说明识别与钳制至少一个在工作）
    interpretation:
      - "看到 `[落点观测·放置]` ⇒ Ctrl 路径**确实**经 SlotMarker.TryAcceptOnce（H2 排除）⇒ OPT-2 的钳点有效。"
      - "看不到 ⇒ Ctrl 路径绕过它（H2 成立）⇒ 需改钳 `GraphUtils` 链（TryAcceptOnce / InsertToActiveContainer）。"
      - "行里 `机器判据=false` 且 `所属=<顶层容器>` ⇒ H1 成立（owner: 链取不到机器）⇒ OPT-3 的补判据必要。"
      - "行里 `marker.numTransfer=` 的数值 ⇒ 判断 H3。"
    why_not_guess: |
      项目铁律「不可知风险的方法默认不用」+ 上一轮"Ctrl 已覆盖"的误判，都指向同一件事：
      在拿到这条日志前不动钳量逻辑。故本轮【只加探针，不改行为】。

  recommendation:
    - "第 1 步（本轮已做）：只加诊断探针（DiagLog 门控，零行为改动），跑决定性实验拿到日志。"
    - "第 2 步：按日志落点选 OPT-2（最好）或 OPT-3；OPT-2 落地时必须带 cfg 开关 + 受控实测（余量守恒）。"
    - "第 3 步（可选）：快移统一收到 Alt（OPT-1）—— 只解决快移手感，不作为主修法。"
    - "不删 DestroyFix 的 6 处 Prefix：在机器入口真正被堵死之前，它们仍是唯一的兜底。"

  code_added_this_round:
