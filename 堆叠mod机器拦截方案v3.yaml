# 十三、第二轮实机反馈（2026-10-13 00:37）与两项定稿改动
# ══════════════════════════════════════════════════════════════════════
second_round_feedback:
  user_report:
    - id: "FB-1"
      text: "Ctrl+左键点击快移彻底不能快移到机器里，哪怕物品数量为 1 也被拒绝"
      log_evidence: |
        [Ctrl 快移·拦截] 合并候选被判定为「机器容器内不允许堆叠」→ 拒绝本次合并（物品留在源处）：
        源 scrap_metal ×1 → 目标堆 scrap_metal ×1
    - id: "FB-2"
      text: "Alt+左键点击的目标窗口判定没改；要求改为和 Ctrl 一样的逻辑判定"
      clarification: |
        用户明确澄清：关键点**不在鼠标所在窗口**，而是把「主仓库 ↔ 柜台」的双向配对机制
        改成 Ctrl 那套逻辑（目标由游戏自己判定）。

  # ── FB-1 根因 ──
  fb1_root_cause: |
    §十二的修复（owner: 短路）生效后，机器 Deny 第一次真正开始工作 —— 于是暴露了下一层问题：
      · 机器里**已有**同种物品时，原生给 Ctrl 快移选的落点是「那个已有堆的格子」（合并候选）；
      · 本挂在 `SlotMarker.TryAcceptOnce` 的闸门按「机器容器内不允许堆叠」**返 0 硬拒**；
      · 而 `GraphUtils.TryAcceptOnce` 是**单次调用**（不像拖放有 EndDrag 的 ×≤40 循环兜底），
        硬拒 = 整条快移失败 ⇒ 连 ×1 都进不去机器。
    ⇒ 结论：问题不是"不该拦"，而是**只拦不导**。拖放路径靠 `MayStack → false` 让原生自己找空槽，
       快移路径没有这个二次搜索，必须由本 mod 补上。

  # ── FB-1 修法：改投空槽（复刻原生 InsertToActiveContainer 的语义）──
  fb1_fix:
    file: "StackPatches.Merge.cs（Patch_SlotMarkerTryAcceptOnce 阶段1）"
    mechanism: |
      反汇编依据（`GraphUtils::InsertToActiveContainer` 0x766020）：
          mov esi, [rbp+0x1f8]        ; esi = item.unitCount
          xor ebx, ebx                ; i = 0
        loop: cmp ebx, esi / jge 退出 ; while (i < unitCount)
          mov ecx, 4                  ; 接口 slot 4 = TryFindOneValidInventorySlot
          call 0x180003fa0            ; ★ 每件都重新找一个槽
      ⇒ 原生自己就是「逐件循环 + 每件重新找槽」，而"找槽"会经 MayStack ⇒ 机器 Deny 让它只拿空槽。
        本 mod 的 TryFillEmptySlots 即照抄这个语义。
    behavior: |
      机器容器内 + 合并候选被 Deny 时：
        ① 循环调 `grid.TryFindOneValidInventorySlot(source)` 找槽，只投 targetItem==null 的空槽；
        ② 每件只投 1（`m.TryAcceptOnce(1)`），再由 MaxNumAdd 钳 1 双保险 ⇒ 每格 1 件；
        ③ 槽位指针去重（HashSet<long>）：见过即终止 —— 防止 finder 反复返回同一槽导致死循环，
           也避免"见到已占用就 break"造成一次点击只填 1 格的可用性退化；
        ④ moved>0 ⇒ __result=moved 并跳过原生；moved==0 ⇒ 退回返 0 硬拒（物品留源，不丢件）。
    fail_safe: "任何异常 → 退回硬拒；物品留在源容器。不存在丢件路径。"

  # ── FB-2 修法：Alt 转发给 Ctrl 的原生 OnEventRelease ──
  fb2_fix:
    decision: "AltPairMode 新增第三个值 'ctrl'，并由用户定稿为该语义（代码默认 + cfg 已同步改）。"
    file: "ModifierPairTransfer.cs（TryRelayItemToCtrl / Patch_PairReleaseAlt / Alt1）"
    mechanism: |
      不再自造落点（旧：主仓库↔柜台固定配对），而是**借状态给 Ctrl handler 并调用它自己的方法**：
          ctrl.currentItem      = item;
          ctrl.isQuickTransfer  = true;
          ctrl.OnEventRelease(keys);      // ★ keys 必须传
      ⇒ raycast → TreeNodeRender::FindParentWindow → 活动容器 → 落点搜索，全部由游戏原生完成。
    why_keys_is_mandatory:
      evidence: |
        反汇编 `ItemQuickTransferHandler::OnEventRelease` 0x7E2090：
            mov rbx, rdx            ; rdx = keysReleased 形参
            test rbx, rbx / je 退出  ; ★ null ⇒ 什么都不做（静默空转）
            ... call 0x180009830     ; keysReleased.Contains(this.key@0x20)
            test al,al / je 退出     ; ★ 不含主键 ⇒ 退出
        文档 §5.2 亦记：① isQuickTransfer==1 且匹配 key，否则返回。
      conclusion: "不传集合 = 编译不过；传 null / 空集合 = 运行期静默空转（物品不动、无日志）。"
      how_obtained: |
        用 Harmony 的 `object[] __args` 取参，而非按名注入 —— 两个 Alt 变体的形参名不一致
        （dump.cs 中一个叫 keysReleased、一个叫 keysPressed），按名注入会在其中一个上抛
        「找不到参数」。`__args[0]` 与名字无关，天然鲁棒。
    retained_by_mod:
      - "数量可配：转发前把源堆预裁到 AltQuickTransferAmount（默认 1），余量归还源容器（不丢件）"
      - "安全性：被转发的这次调用同样进 Ctrl 作用域 ⇒ 机器容器自动改投空槽（FB-1 的修复对 Alt 同样生效）"
    anti_recursion: "_relayDepth>0 时 DispatchPairRelease 不再接管，防 Alt/Ctrl 互相转发；Ctrl 闸门照常工作。"

  cfg_change_applied:
    file: "UserData/MelonPreferences.cfg"
    entry: 'AltPairMode = "ctrl"   （原为 "counter_inv"）'
    why_manual: |
      MelonPreferences **不会**用代码默认值覆盖已存在的 cfg 项 —— 只改代码默认值对已有存档无效。
      故同步改了实际 cfg（已备份 MelonPreferences.cfg.bak-20261013-005657）。
    rollback: "改回 counter_inv / native 即可，或关总闸 ModifierKeysEnabled。"

  regression_guard_added:
    file: "_tests/ItemStacking.Tests/ContainerTokenMatchTests.cs"
    test: "AltRelay_MustForwardKeysReleased"
    asserts:
      - "源码必须出现 OnEventRelease(keys)（禁止退回无参调用）"
      - "keys 必须来自 __args[0]（与形参名无关）"
      - "取不到集合时必须显式告警（日志 key relay-keys），不留静默空转"
    total_tests: 40

  verification_for_user:
    - "启动日志应出现：★ Alt 快移（§四）= 模式「ctrl」（★ 与 Ctrl+点击同一条逻辑…）"
    - "Ctrl+点击 一叠 scrap_metal 进已有同种物品的熔炉：日志应由 [Ctrl 快移·拦截] 变为 [Ctrl 快移·机器改投空槽] … 放入空槽 ×N"
    - "表现：每次点击填入机器的空槽，每格 1 件；机器内不再出现 unitCount>1"
    - "Alt+点击：应与 Ctrl+点击落到同一个容器（目标由游戏判定），且一次只搬 AltQuickTransferAmount 件（默认 1）"
    - "若出现 [Alt→Ctrl 转发] 取不到本次 keysReleased 告警 ⇒ 说明 __args 取参失败，请把该行发我"
