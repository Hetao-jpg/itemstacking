      v2_said: "STATUS: 待实施（前置验证未完成）"
      actual: "已实现并合入 mod v0.13.0（本工作区未提交改动）"
      disposition: "本文件 STATUS 已改；v2 的『阶段1 验证 / 阶段2 MVP / 阶段3 验证』三阶段计划已完成落地（见 §2）"

    - id: C2
      v2_said: |
        default_tokens 为占位符（furnace/desequencer/brewing_barrel/incubator/
        concentrator/crafting_table），"待反汇编确认"。
      actual: |
        经 item_catalog.json 逐条核对，v2 占位符里 brewing_barrel / incubator /
        concentrator / crafting_table / animal_feeder 【在本作物品目录中不存在】—— 系编造 id。
        真实名单来自「FurnitureItemDirectory / HusbandryDirectory 注册 + Machine* 工厂」，
        共 13 项（见 §3.1）。
      disposition: "代码中 DefaultMachineContainerTokens 用的是 13 项真实名单；占位符已剔除"

    - id: C3
      v2_said: "§九 RE1『找全机器容器 owner: id 全集』priority = blocker"
      actual: "已由《机器容器identifier中英文对照表.md》完成（含 13 项纳入 + 13 项有意排除的理由）"
      disposition: "blocker 解除；排除项见 §3.2"

    - id: C4
      v2_said: "§九 R6 缓解『在 ValidatePatches 里扩展 CheckBlacklistIdsExist』（建议）"
      actual: "已实现：StackPatches.cs CheckBlacklistIdsExist() 已核对 machineContainers 的 owner:/裸 id"
      disposition: "R6 缓解已落地（见 §6 R6）"

    - id: C5
      v2_said: |
        §三 layer_2 的 proposed_code 未含总闸判断（只写 if (IsMachineContainer(...))）。
      actual: |
        真实代码为 `if (StackEnabled && IsMachineContainer(slot.inventory))`。
        这是必要的：MergePolicy.Evaluate 首行 `if (!StackEnabled) return Allow`，
        若 MaxNumAdd 钳制不带同一总闸，会出现「Deny 已停用、钳制仍生效」的半开状态
        （玩家关掉 mod，机器里仍每次只进 1 件）。
      disposition: "代码比 v2 设计更严谨，v2 的示例代码属简化，不改代码"

    - id: C6
      v2_said: "deny_vs_steer 选 MergePolicy.Deny（v2 的新增论证）"
      actual: "已按此实现（MergePolicy.Evaluate §0.5 机器容器 Deny）"
      disposition: "决策保持；见 §4『与 Steerer 的关系』的边界澄清"

  v3_additions:
