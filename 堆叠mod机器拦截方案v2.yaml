      - "记录实测数据到项目文档"

# ============================================================================
# 八、测试用例（v1 基础上增加 v2 视角的边界用例）
# ============================================================================
test_cases:

  - id: TC1
    name: 拖 8 件到熔炉（6 空位）
    input: "拖 8 件 unitCount=8 的物品到熔炉（6 空位）"
    expected: "熔炉 6 格各 1 件，源堆剩 2 件，源堆留在原处"
    priority: high

  - id: TC2
    name: 拖 8 件到解序器（1 空位）
    input: "拖 8 件到解序器（1 空位）"
    expected: "解序器 1 件，源堆剩 7 件"
    priority: high

  - id: TC3
    name: 拖 8 件到熔炉（已放 1 堆）
    input: "熔炉已有 unitCount=3 的堆，玩家拖 8 件"
    expected: "熔炉新增 N 格各 1 件，不与已有堆合并"
    priority: high

  - id: TC4
    name: Alt 快移 8 件到熔炉
    input: "Alt+左键点 8 件物品"
    expected: "只放 1 件（原生单次语义，接受）"
    priority: medium

  - id: TC5
    name: 从机器容器拖出
    input: "从熔炉里拖出物品到背包"
    expected: "正常移动（不触发机器判定）"
    priority: high

  - id: TC6
    name: 在背包里拖 8 件
    input: "在背包里拖 8 件到另一个同类堆"
    expected: "正常合并（不是机器容器）"
    priority: high

  - id: TC7
    name: 机器容器已满
    input: "拖 8 件到已满的熔炉"
    expected: "全部留在原处，无物品进入"
    priority: high

  - id: TC8
    name: 拖 1 件到熔炉
    input: "拖 1 件（unitCount=1）到熔炉"
    expected: "正常入 1 格（边界：不需要拆堆）"
    priority: high

  - id: TC9
    name: 拖 8 件到未识别为机器容器的容器
    input: "拖 8 件到普通背包"
    expected: "正常合并（不受机器容器逻辑影响）"
    priority: high

  - id: TC10
    name: 外置 JSON 覆盖机器容器名单
    input: "Mods/item_blacklist.json 里加 \"machineContainers\": [\"owner:furnace\"]"
    expected: "只把熔炉当机器容器，其他容器不受影响"
    priority: medium

  # ─────────────────────────────────────────────────────────────────────
  # ★ v2 新增边界用例
  # ─────────────────────────────────────────────────────────────────────

  - id: TC11
    name: ★ v2 新增：机器容器判据异常时的行为
    input: "人为破坏 MachineContainerTokens（如 JSON 里塞非法字符），拖物品到机器"
    expected: |
      · IsMachineContainer 抛异常 → MarkJudgeFault(FaultProtection)
      · MergePolicy 判据 ConsumeJudgeFault 命中 → Deny（保守）
      · 日志输出 "[防护降级] [合并决策] 数据保护类判据异常，本次拦截（宁可拦不可丢）..."
    priority: medium
    purpose: "验证 fail-safe 三态语义在机器容器判据上的正确性"

  - id: TC12
    name: ★ v2 新增：机器容器与柜台禁堆的交互
    input: "同时把熔炉 owner 加入机器容器名单【且】BlockCounterStack=true，在柜台里操作熔炉格"
    expected: "柜台与机器容器判据都命中，Deny 原因取先命中的（机器容器）"
    priority: low
    purpose: "验证多判据的定序"

  - id: TC13
    name: ★ v2 新增：机器容器与状态闸门/值域校验的交互
    input: "拖 2 件不同电量的电池到熔炉"
    expected: |
      · MergePolicy.Evaluate 顺序：
          机器容器判据 → 状态一致性 → 值域校验
      · 机器容器先命中 → Deny 原因 = "机器容器内不允许堆叠"
      · 若机器容器判据未命中（如在白名单外） → 状态一致性 Deny
    priority: low
    purpose: "验证判据顺序与现有排序一致"

  - id: TC14
    name: ★ v2 新增：机器容器判据对"放置"（非合并）的影响
    input: "拖 1 件到机器容器空位（targetItem == null）"
    expected: |
      · MergePolicy.Evaluate 阶段 0 检查 ctx.target == null → 直接 Allow
      · 所以机器容器判据【不会】影响"放置"路径
      · 但 MaxNumAdd 钳制【会】影响（numTransfer 从 StackCap 钳到 1）
    priority: high
    purpose: "验证两层判据的分工边界"

