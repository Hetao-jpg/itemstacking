# ============================================================================
# 一、需求定义（不变）
# ============================================================================
requirement:
  title: "堆叠物品进入机器容器自动拆堆"
  user_expectation: |
    玩家拖 N 件堆叠物品到机器容器（熔炉/解序器/酿酒桶等）时：
    1. 自动拆成单件，逐格填充，直到容器满或物品不足
    2. 机器容器内【不允许】任何形式的堆叠合并
    3. 未填完的余量【保留在源位置】，不丢件
  example:
    scene: "玩家拖 8 件物品到有 6 个空位的熔炉"
    expected:
      - "熔炉 6 格各放 1 件（不合并）"
      - "源堆剩 2 件，留在原处"
      - "无需玩家反复操作"
  motivation: |
    原版游戏假设 unitCount == 1（从未有堆叠），所有机器逻辑隐含此假设：
    · Destroy(item) → 销毁整堆（DestroyFix.cs 已修 6 处）
    · 遍历 items 处理 → 只处理一次（视为 1 件）
    · 数量计算 → item.unitCount 被当 1 用

    在机器入口【前置拆堆】是治本方案：
    · 机器内部永远看不到 unitCount > 1 的物品
    · 无需为每个机器单独写 Prefix 补丁
    · 未来新增机器只需加名单

# ============================================================================
# 二、机制分析（v2 强化：论证两层判据的不可替代性）
# ============================================================================
mechanism_analysis:

  native_capabilities:
    title: "原版已具备的机制（无需重建）"
    items:
      - id: NC1
        name: TryFindOneValidInventorySlot 的"叠加优先"逻辑
        behavior: |
          阶段③：遍历 items，对每个 other 判 MayStack
            · true  → marker.targetItem = other（合并候选）
            · false → continue（跳过，找下一个）
          阶段④：找不到合并候选 → 走形状扫描找空位
      - id: NC2
        name: EndDrag 的 40 次循环（移动机制 §5.1 路径 3）
        behavior: |
          for (i = 0; i < 40 && currentRemove >= 1; i++):
              marker = TryFindOneValidInventorySlot(hover, item)
              if (marker == null || marker.numTransfer < 1) break
              accepted = TryAcceptOnce(marker, currentRemove)
              currentRemove -= accepted
      - id: NC3
        name: TryAcceptOnce 的自动拆堆（堆叠机制 §5.2）
        behavior: |
          amount = min(请求, numTransfer, MaxNumRemove)
          if (amount >= item.unitCount) → 整堆移动（Expel + Accept）
          else                          → GetSplitItem(amount) → Accept 拆出的
      - id: NC4
        name: GetSplitItem 的余量保留（堆叠机制 §5.3）
        behavior: "拆出的 item.unitCount -= n，原堆留原处；新实例 unitCount = n"

    conclusion: |
      原版机制完备——只要：
        ① MayStack 拒绝机器容器内的合并（不让走阶段③）
        ② MaxNumAdd 钳到 1（每次只放 1 件）
      原生 EndDrag 的 40 次循环就会自动完成"逐格填充"

  layer_necessity:
    title: "★ v2 新增：为什么两层判据都【必须】有（互不替代）"
    maystack_necessity:
      question: "只做 MaxNumAdd 钳到 1 够不够？"
      answer: "不够——MaxNumAdd 钳到 1 只防'一次放多件'，不防'合并到已有堆'。"
      mechanism: |
        若 MayStack 放行，原生阶段③会命中合并候选：
          marker.targetItem = other（已有的堆）
          marker.numTransfer = min(maxRemove, other.MaxNumAdd())
                             = min(maxRemove, 1)  ← 钳到 1 生效
                             = 1
          → TryAcceptOnce(marker, 1) → StackItemUnchecked(other, targetItem, 1)
          → targetItem.unitCount += 1  ← ★ 污染已有堆！
        所以 MayStack【必须】Deny，才能让阶段③完全跳过合并候选。
      conclusion: "MayStack 是"阻止合并到已有堆"的唯一点；MaxNumAdd 无法替代。"
    maxnumadd_necessity:
      question: "只做 MayStack Deny 够不够？"
      answer: "不够——MayStack Deny 只阻止"合并"，不阻止"一次放多件到空位"。"
      mechanism: |
        若 MayStack Deny（阶段③落空）→ 阶段④找空位：
          marker.targetItem = null（空位）
          marker.numTransfer = min(maxRemove, MaxNumAdd())
                             = min(maxRemove, StackCap)  ← MaxNumAdd 未钳制
                             = StackCap（如 10）
          → TryAcceptOnce(marker, -1) → 用 marker.numTransfer
          → amount = 10 → 10 件一起进同一格  ← ★ 违反"每格 1 件"！
        所以 MaxNumAdd【必须】钳到 1，才能让每格只放 1 件。
      conclusion: "MaxNumAdd 是"每格 1 件"的唯一点；MayStack 无法替代。"
    summary: "两层互补，缺一不可。"

  layer_choice:
    title: "为什么在 MayStack + MaxNumAdd 层，而不是 UncheckedAccept 层"
    rejected_option:
      layer: "GameGridInventory.UncheckedAccept"
      reason: |
        UncheckedAccept 被调用时，物品【已经】被 TryAcceptOnce 拆好或合并好了。
        在它这层拦截会：
        · 破坏 TryAcceptAll 的循环语义（0.10.1 已踩过的坑：返 0 打断循环）
        · 需要重建"拆堆 + 归还"逻辑（重复发明轮子）
        · 时机太晚——已经错过了"意图决策"点
    chosen_option:
      layer: "MayStack（决策层）+ MaxNumAdd（容量层）"
      reason: |
        这两层是【意图决策】点。让原生【自己完成循环】——
        这才是"与游戏机制合谋"而非"对抗"。

  deny_vs_steer:
    title: "★ v2 新增：选 Deny（MergePolicy）还是 导流（MergeSteerer）？"
    effect_comparison:
      - option: "MergePolicy.Deny"
        effect: "Patch_MayStack.Prefix 返回 __result=false; return false"
        downstream: "原生阶段③ `if (!item.MayStack(other)) continue;` 命中 → 跳过"
      - option: "MergeSteerer.ShouldSteerToEmptySlot 返回 true"
        effect: "同上（Patch_MayStack.Prefix 走 Steerer 分支后 return false）"
        downstream: "同上"
    decision: "选 MergePolicy.Deny"
    rationale: |
      ① 【语义】：机器容器禁并是【数据保护】判据（机器假设 unitCount==1，
         违反则崩）。与 StateConsistency / ValueGate 同级，属 MergePolicy 的职责。
      ② 【Steerer 定位】：Steerer 只承载"允许合并但优先给空位"的场景
         （Alt 快移、柜台、配对快移）。机器容器不是"允许合并但优先"，
         而是"完全禁止合并"——不属于 Steerer 的语义范围。
      ③ 【代码位置】：MergePolicy.Evaluate 里已有"阶段 3"注释块（柜台移交 Steerer），
         机器容器判据紧接其后，与"柜台已移交"的说明自然衔接。
      ④ 【故障语义】：MergePolicy 里 Deny 走 FaultProtection 路径（数据保护类），
         这与"机器容器判据异常时宁可拦不可丢"的期望一致。
    non_goal: "不修改 MergeSteerer.cs（无需在 ShouldSteerToEmptySlot 里加机器容器判据）。"

# ============================================================================
# 三、分层设计方案（v2 精确对齐现有代码）
# ============================================================================
design:

  architecture: |
    ┌─────────────────────────────────────────────────────────────────┐
    │ 第 1 层：MergePolicy.Evaluate —— 机器容器内禁止合并（Deny）    │
    │   插入点：Evaluate 内、"阶段 3"注释块【之后】、IsContainer 之前  │
    │   代码：if (IsMachineContainer(ctx.slotInventory)) return Deny    │
    └─────────────────────────────────────────────────────────────────┘
                                 ↓
    ┌─────────────────────────────────────────────────────────────────┐
    │ 第 2 层：Patch_MaxNumAdd.Postfix —— 机器容器内钳到 1          │
    │   插入点：Postfix 内、`if (slot == null) return;` 之后         │
    │   代码：if (IsMachineContainer(slot.inventory)) __result = 1   │
    └─────────────────────────────────────────────────────────────────┘
                                 ↓
    ┌─────────────────────────────────────────────────────────────────┐
    │ 第 3 层：TryAcceptOnce / UncheckedAccept / MergeSteerer        │
    │   —— 全部不动                                                   │
    │   · 原生 EndDrag 40 次循环自动完成"逐格填充"                    │
    └─────────────────────────────────────────────────────────────────┘

  # ---------------------------------------------------------------------------
  # 第 1 层：MergePolicy.Evaluate —— 机器容器 Deny
  # ---------------------------------------------------------------------------
  layer_1_mergepolicy:
    name: "机器容器禁并（MergePolicy.Deny）"
    location: "MergePolicy.cs · Evaluate 方法内"
    insertion_point: |
      ★ 精确锚点（对应 MergePolicy.cs 现有内容）：
        · 上方：`// ★ 阶段3：柜台判据已移交 MergeSteerer（属【导流】职责，不是拦截）`
                 及整段说明注释（约 8 行）
        · 下方：`// ── 1) 容器（数据保护）──` + `if (IsContainer(...))`
      新代码插入在这两者之间，独占一段。
    proposed_code: |
      // ── 0.5) ★ 机器容器：禁止合并（数据保护）──
      //   背景（机器容器禁令的必要性见方案 v2 §二 layer_necessity）：
      //     · 原版机器逻辑假设 unitCount == 1，堆叠会触发崩坏/丢件。
      //     · Deny → MayStack.Prefix 返回 false → 原生阶段③跳过合并候选。
      //   ★ 与 Steerer 的关系：机器容器是"完全禁止合并"（数据保护），
      //     不走 MergeSteerer.ShouldSteerToEmptySlot（那是"允许合并但优先给空位"）。
      //   ★ 故障语义：判据异常时 IsMachineContainer 返回 false（放行），
      //     但下一行 ConsumeJudgeFault 会捕获——若判据抛异常，走 Deny 保守路径。
      if (IsMachineContainer(ctx.slotInventory))
      {
          if (ConsumeJudgeFault(FaultProtection))
          { WarnPolicyFault("mp.fault.machine", true); return MergeVerdict.Deny; }
          reason = "机器容器内不允许堆叠";
          return MergeVerdict.Deny;
      }
      if (ConsumeJudgeFault(FaultProtection))
      { WarnPolicyFault("mp.fault.machine", true); return MergeVerdict.Deny; }
    rationale: |
      · 位置在 IsContainer 之前：机器容器判据优先于"含物品容器"判据
        （机器容器内即便有物品，也应先命中机器容器禁并）。
      · 完整的"故障位消费"模式：与现有 IsContainer / StatesEqual / ValueGate
        判据风格一致（判据调用 → ConsumeJudgeFault → 未命中则填 reason）。
      · 新 key "mp.fault.machine" 与现有 "mp.fault.container" /
        "mp.fault.statecmp" / "mp.fault.valuegate" 等并列。
    expected_flow: |
      Patch_MayStack.Prefix：
        ① ShouldSteerToEmptySlot → false（机器容器不进 Steerer）
        ② Evaluate → Deny（reason = "机器容器内不允许堆叠"）
        ③ Patch_MayStack.Prefix 命中 Deny 分支：
             Diag("MayStack 拦截（MergePolicy·机器容器内不允许堆叠）...")
             __result = false; return false;
      原生：阶段③ `if (!item.MayStack(other)) continue;` → 全部跳过 → 阶段④找空位
    api_dependency:
      - "IsMachineContainer(GameInventory) → bool（本方案新增，见 §四）"
      - "FaultProtection / ConsumeJudgeFault / WarnPolicyFault（现有）"
      - "MergeContext.slotInventory（现有）"

  # ---------------------------------------------------------------------------
  # 第 2 层：Patch_MaxNumAdd.Postfix —— 机器容器钳到 1
  # ---------------------------------------------------------------------------
  layer_2_maxnumadd:
    name: "机器容器内每次只放 1 件（MaxNumAdd 钳制）"
    location: "StackPatches.Value.cs · Patch_MaxNumAdd.Postfix 内"
    insertion_point: |
      ★ 精确锚点（对应 StackPatches.Value.cs 现有内容）：
        · 上方：`if (slot == null) return;   // 无参转发路径（slot 未构造）不动`
        · 下方：`int before = __result;  var target = slot.targetItem;`
      新代码插入在这两行之间，早于现有堆叠/空槽逻辑。
    proposed_code: |
      // ★ 机器容器：空位或已有堆都只放 1 件（配合 MergePolicy 的机器容器 Deny 使用）
      //   必要性：MayStack Deny 只阻止"合并到已有堆"；若 MaxNumAdd 不钳制，
      //   空位分支会走 StackCap 一次放多件 → 违反"每格 1 件"。
      //   两层互补的完整论证见方案 v2 §二 layer_necessity。
      //   ★ 早于普通容器逻辑：机器容器判据优先级最高，避免被后续逻辑覆盖。
      if (IsMachineContainer(slot.inventory))
      {
          if (__result != 1)
          {
              LogOnce("machine.add." + SafeId(__instance), Level.Diag,
                  $"机器容器内 MaxNumAdd 钳到 1：{SafeId(__instance)}（原 {__result}）",
                  max: 3);
              __result = 1;
          }
          return;   // 早返回，不改动普通容器逻辑
      }
    rationale: |
      · 钳到 1：无论空位还是已有堆，机器容器每次只放 1 件。
      · 早返回：不改动普通容器逻辑（普通容器行为逐字节不变）。
      · 日志：DiagLog=true 时显示钳制动作（便于排查）。
      · 位置：与现有 `if (slot == null) return;` 相邻，属"前置守卫"段。
    why_not_zero: |
      · 返回 0 → TryAcceptOnce 内部 amount = min(0, ...) = 0 → return 0
        → 不搬运（等同"拒绝入容器"——机器容器将永远接收不到任何物品）
      · 返回 1 → amount = min(请求, 1, ...) = 1 → 每次搬 1 件（符合期望）
      · 所以必须返回 1 而不是 0
    api_dependency:
      - "IsMachineContainer(GameInventory) → bool（本方案新增）"
      - "LogOnce（现有）"
      - "SafeId（现有）"

  # ---------------------------------------------------------------------------
  # 第 3 层：不动
  # ---------------------------------------------------------------------------
  layer_3_no_change:
    name: "TryAcceptOnce / UncheckedAccept / MergeSteerer 全部不动"
    notes:
      - "SlotMarker.TryAcceptOnce：0.10.1 已定"纯观测直通"，不动"
      - "GameGridInventory.UncheckedAccept：本身不承载"意图决策"，不动"
      - "MergeSteerer.ShouldSteerToEmptySlot：不进机器容器判据（Deny 已在 MergePolicy 兜住）"
      - "DestroyFix.cs 的 6 处 Prefix：保守保留（双层防护）"

# ============================================================================
# 四、机器容器识别机制（v2 精确定位到现有文件）
# ============================================================================
machine_container_detection:

  token_reuse: |
    ★ 复用现有 IsContainerInList 的三路 token 匹配（裸 id / slot: / owner:），
    与 ContainerWhitelist / ContainerBlacklist 共用同一套判据——零学习成本。
    ★ 前缀常量复用 Constants.TokenOwnerPrefix / Constants.TokenSlotPrefix。

  default_tokens:
    status: "待反汇编确认"
    placeholder:
      - "owner:furnace"
      - "owner:desequencer"
      - "owner:brewing_barrel"
      - "owner:incubator"
      - "owner:concentrator"
      - "owner:crafting_table"
    note: |
      ★ 上述为占位符，需从 ContainerItemDirectory 工厂方法反汇编确认。
      每个机器的容器物品 identifier（如 "furnace"）→ owner:furnace token。

  code_location:
    file: "BuiltinBlacklist.cs"
    rationale: |
      · 与 DefaultBlock* 名单同文件——都是"内置名单"性质。
      · 加载路径复用 LoadBuiltinBlacklist()（已有 JSON 加载基础设施）。
      · 外置覆盖复用 TryOverride()（已有）。
    insertion_point: |
      ★ 精确锚点（对应 BuiltinBlacklist.cs 现有内容）：
        · 上方：`private static readonly string[] DefaultBlockSuffixExempt = ...`
        · 下方：`// ──────────────────────────────────────────────────────────────────────`
                `// 生效名单（由 LoadBuiltinBlacklist() 在启动时填充；未加载前 = 代码默认值）`
      新代码插入在这两者之间，与 DefaultBlock* 并列。

  code: |
    // ★ 机器容器名单：机器容器内不允许堆叠合并，且每次只放 1 件。
    //   与 ContainerWhitelist 共用 token 匹配（裸 id / slot: / owner:）——
    //   复用 IsContainerInList / MatchesContainerToken 判据，零学习成本。
    //   ★ 反汇编取证：owner: 后的 id 来自 ContainerItemDirectory 工厂方法
    //     （见方案 v2 §九 prerequisites·RE1）。
    private static readonly string[] DefaultMachineContainerTokens =
    {
        // 待反汇编 ContainerItemDirectory 确认（占位符）
        "owner:furnace",
        "owner:desequencer",
        "owner:brewing_barrel",
        "owner:incubator",
        "owner:concentrator",
        "owner:crafting_table",
    };

    // 生效名单（由 LoadBuiltinBlacklist() 在启动时填充；未加载前 = 代码默认值）。
    private static string[] MachineContainerTokens = DefaultMachineContainerTokens;
    private static string _machineSource = "代码默认";

    // ★ 机器容器识别（供 MergePolicy.Evaluate / Patch_MaxNumAdd.Postfix 调用）。
    //   复用现有 IsContainerInList（裸 id / slot: / owner: 三路匹配）。
    //   ★ 判据异常时返回 false（放行）—— 与 IsContainer 同款 fail-safe 语义；
    //     真正的"故障位"由调用点（MergePolicy）的 ConsumeJudgeFault 兜住。
    internal static bool IsMachineContainer(GameInventory inv)
    {
        if (inv == null) return false;
        if (MachineContainerTokens == null || MachineContainerTokens.Length == 0)
            return false;
        try
        {
            return IsContainerInList(inv, string.Join(",", MachineContainerTokens));
        }
        catch
        {
            // 与 IsContainer 同款：fail-safe 返回 false。
            // 但为保守起见，标记 FaultProtection —— MergePolicy 会据此 Deny。
            MarkJudgeFault(FaultProtection);
            return false;
        }
    }

  loading_extension: |
    ★ 在 LoadBuiltinBlacklist() 内、现有 5 个 TryOverride 之后，增加一行：
        anyOverride |= TryOverride(doc, "machineContainers",
                                   ref MachineContainerTokens, ref _machineSource);
    ★ 现有 anyOverride 判定逻辑自然覆盖（若机器容器名单被 JSON 覆盖，
      anyOverride 变 true，触发"[名单] 已加载外部..." 的日志）。
    ★ 建议在日志里额外打印机器容器名单规模（与现有 id/前缀/子串/后缀并列）。

  external_override: |
    与 BuiltinBlacklist 一致，支持外置 JSON 覆盖：
    Mods/item_blacklist.json 里加 "machineContainers": ["owner:furnace", ...] 字段。
    ★ 遵循现有"代码默认值 + 可选覆盖"双层语义：
      · JSON 未提供该字段 → 用代码默认值。
      · JSON 提供空数组 [] → 显式清空（用户意图）。
      · JSON 提供非空数组 → 覆盖。

# ============================================================================
# 五、收益分析
# ============================================================================
benefits:

  direct_benefits:
    - id: B1
      name: 一次拖拽自动填充
      detail: "玩家拖 N 件，自动铺满 M 格，无需反复操作"
    - id: B2
      name: 杜绝机器内合并
      detail: |
        两层互补（MayStack Deny 阻止合并到已有堆 + MaxNumAdd 钳制阻止一次放多件）
        ⇒ 机器容器内每格最多 1 件，机器逻辑永远看到 unitCount == 1。
    - id: B3
      name: 余量自动保留
      detail: "原生 EndDrag 40 次循环里 currentRemove -= accepted，原堆 unitCount -= accepted，余量留在原处"
    - id: B4
      name: 零侵入 TryAcceptOnce / UncheckedAccept
      detail: "避开 0.10.1 踩过的'返 0 打断 TryAcceptAll 循环'的坑"

  architecture_benefits:
    - id: A1
      name: 与现有白名单策略协同
      detail: "机器容器可选择性加入 ContainerWhitelist；与"机器容器禁并"形成双层防护"
    - id: A2
      name: 未来兼容新机器
      detail: "只需在名单里加 owner:xxx，无需为每个机器写 Prefix 补丁"
    - id: A3
      name: 替代现有"逐个机器 Prefix 拆堆"
      detail: |
        现有 DestroyFix.cs 有 6 处独立修复：
          · Patch_ConsumeSecondArg（3 个消费者）
          · Patch_FurnaceConsume（熔炉 lambda）
          · Patch_FinishDesequencer（解序器）
          · Patch_TransferAfterhourToInv（拾荒口袋）

        上本方案后，熔炉/解序器/升级打印机【在入口就被拆成单件】
        → 它们内部根本不会看到 unitCount > 1
        → Prefix 拆堆逻辑可简化甚至移除（保守：双层防护保留）
    - id: A4
      name: 与游戏机制合谋而非对抗
      detail: "在【意图决策层】修正，让原生自己去完成循环"
    - id: A5
      name: ★ v2 新增：充分利用现有基础设施
      detail: |
        · token 匹配复用 IsContainerInList（三路匹配）
        · JSON 加载复用 TryOverride（"代码默认+可选覆盖"双层语义）
        · 故障位复用 FaultProtection / ConsumeJudgeFault / WarnPolicyFault
        · 日志复用 LogOnce / Diag / SafeId
        · 探针复用 ProbeScopeInventory（可选，用于诊断）
        ⇒ 新增代码 ~50 行（含机器名单），不含探针增强

# ============================================================================
# 六、风险分析（v1 基础上增加 v2 视角）
# ============================================================================
risks:

  high_risks:
    - id: R1
      name: EndDrag 的 40 次循环触发条件不确定
      severity: high
      description: |
        从移动机制 §5.1 看，循环的触发条件是：
          if (MayPlayerInsertInto(this+0x88) && item.MayHaveValidInventorySlot(this+0x88))
        · this+0x88 = hoverElement（鼠标悬停元素）
        · 拖到具体格子 → 可能触发
        · 拖到容器背景/标题 → 可能不触发，只走路径 2（放 1 件）
      mitigation:
        - "阶段 1 实测：拖到熔炉不同位置，观察是否都触发自动填充"
        - "若不触发：可考虑在 EndDrag Postfix 里加自定义循环（侵入性更强）"
        - "或接受'拖到格子才自动填充'，玩家一次操作即可学会"

    - id: R2
      name: 快捷转移（Alt/Ctrl）走 TryAcceptOnce 单次
      severity: medium
      description: |
        从堆叠机制 §5.2 看，快捷转移走 GraphUtils.TryAcceptOnce（单次调用）——
        不循环。所以 Alt 快移只会放 1 件到机器容器。
      mitigation:
        - "接受现状：Alt 快移本来就是'一次搬 1 个'的语义"
        - "或为机器容器写专门的 TryAcceptAll 循环（增加复杂度）"

    - id: R3
      name: MaxNumAdd 被 9 处调用
      severity: medium
      description: |
        MaxNumAdd 被 9 处调用（4× TryInventorySlot / 4× CheckInventorySlotStillValid
        / GetStackSlot）。钳制到 1 可能影响某些判定。
      analysis: |
        · 空位：MaxNumAdd 返回 1 → CheckInventorySlotStillValid 认为'能放 1 件'
          → numTransfer >= 1 仍成立 → 通过
        · 已有堆：MayStack Deny 会阻止阶段③命中合并候选，所以 MaxNumAdd 的
          "已有堆"分支不会被调用（机器容器内）
      mitigation:
        - "阶段 1 实测：验证 MaxNumAdd=1 后普通容器行为无变化"
        - "机器容器的 owner: token 与普通容器不重叠，误伤面为零"

  medium_risks:
    - id: R4
      name: 机器容器名单不全
      severity: medium
      description: "漏了某个机器 → 该机器仍会接受堆叠物品 → 老 bug。"
      mitigation:
        - "反汇编 ContainerItemDirectory 工厂方法，找全机器容器（§九 RE1）"
        - "提供外置 JSON 让玩家自行添加"

    - id: R5
      name: 老存档里机器容器已有堆
      severity: medium
      description: |
        玩家老存档里机器容器已经有个 unitCount=3 的堆：
        · MayStack Deny 会阻止新的合并
        · 但没有修复已有的堆
      mitigation:
        - "接受现状：老堆就在那，玩家自己处理"
        - "或提供'读档时扫描机器容器，把堆拆成单件'的功能（成本高）"

    - id: R6
      name: 机器容器的 owner: token 不稳定
      severity: medium
      description: |
        游戏更新改了机器的 identifier（如 furnace → smelter），
        owner:furnace 匹配不上 → 静默失效。
      mitigation:
        - "★ v2 新增：在 ValidatePatches 里扩展 CheckBlacklistIdsExist 逻辑，
          提取机器容器 token 的 owner: 后的 id，与 item_catalog.json 比对
          （复用现有 MiniJson.ExtractAllStringsByKey）。"
        - "或做'容器特征探测'（如容器 size + 不接受堆叠 = 疑似机器）"

  low_risks:
    - id: R7
      name: 与现有 ContainerWhitelist 语义重叠
      severity: low
      description: |
        如果机器容器【不在白名单】（当前默认），玩家本来就放不进去堆叠物品——
        本方案对这类容器无实际作用。
      note: "本方案主要服务'玩家手动把机器容器加入白名单'的场景"

    - id: R8
      name: 机器容器的'1 格 1 件'是硬约束吗
      severity: low
      description: |
        某些机器可能允许格子里放多件（如熔炉允许 1 格 5 件矿石同时熔炼）。
        如果硬性 1 格 1 件，可能限制玩家的正常玩法。
      mitigation: "实测每个机器的正确行为，必要时为个别机器开例外"

# ============================================================================
# 七、实施阶段（v2 增加"实施顺序矩阵"）
# ============================================================================
implementation:

  order_matrix:
    title: "★ v2 新增：编辑顺序与回滚点"
