      - "IsMachineContainer 方法（BuiltinBlacklist.cs）"
      - "MergePolicy.Evaluate 里的机器容器判据"
      - "Patch_MaxNumAdd 里的机器容器钳制"
      - "LoadBuiltinBlacklist 里的 JSON 覆盖扩展"
    non_deliverables:
      - "不删除 DestroyFix.cs 的 6 处 Prefix（保守：双层防护）"
      - "不修改 MergeSteerer.cs"
      - "不修改 SlotMarker.TryAcceptOnce"

  phase_3_verify:
    name: "阶段 3：验证与简化（1-2 周）"
    goal: "完整测试 + 评估是否移除旧补丁"
    steps:
      - "完整测试：每种机器 × 每种拖拽方式（见 §八 测试用例）"
