# ============================================================================
# 十一、附录：完整代码骨架（v2 对齐现有风格）
# ============================================================================
appendix:

  complete_code_skeleton: |
    // ══════════════════════════════════════════════════════════════════════
    //  文件 1：BuiltinBlacklist.cs —— 新增机器容器名单 + 识别
    //  ★ 插入点：在 DefaultBlockSuffixExempt 之后、"生效名单"注释块之前
    // ══════════════════════════════════════════════════════════════════════

    // ★ 机器容器名单：机器容器内不允许堆叠合并，且每次只放 1 件。
    //   与 ContainerWhitelist 共用 token 匹配（裸 id / slot: / owner:）。
    //   ★ 反汇编取证：owner: 后的 id 来自 ContainerItemDirectory 工厂方法。
    private static readonly string[] DefaultMachineContainerTokens =
    {
        // 待反汇编 ContainerItemDirectory 确认（占位符）
        "owner:furnace",
        "owner:desequencer",
        "owner:brewing_barrel",
        "owner:incubator",
        "owner:concentrator",
        "owner:crafting_table",
    };

    // 生效名单（由 LoadBuiltinBlacklist() 在启动时填充；未加载前 = 代码默认值）。
    private static string[] MachineContainerTokens = DefaultMachineContainerTokens;
    private static string _machineSource = "代码默认";

    internal static bool IsMachineContainer(GameInventory inv)
    {
        if (inv == null) return false;
        if (MachineContainerTokens == null || MachineContainerTokens.Length == 0)
            return false;
        try
        {
            return IsContainerInList(inv, string.Join(",", MachineContainerTokens));
        }
        catch
        {
            MarkJudgeFault(FaultProtection);
            return false;
        }
    }

    // ★ LoadBuiltinBlacklist 内（现有 5 个 TryOverride 之后）追加一行：
    //   anyOverride |= TryOverride(doc, "machineContainers",
    //                              ref MachineContainerTokens, ref _machineSource);


    // ══════════════════════════════════════════════════════════════════════
    //  文件 2：MergePolicy.cs —— 机器容器 Deny 判据
    //  ★ 插入点：Evaluate 内，"阶段3"注释块【之后】、IsContainer 判据【之前】
    // ══════════════════════════════════════════════════════════════════════

    // ── 0.5) ★ 机器容器：禁止合并（数据保护）──
    //   背景：原版机器逻辑假设 unitCount == 1，堆叠会触发崩坏/丢件。
    //   手段：Deny → MayStack.Prefix 返回 false → 原生阶段③跳过合并候选。
    //   ★ 与 Steerer 的关系：机器容器是"完全禁止合并"（数据保护），
    //     不走 MergeSteerer.ShouldSteerToEmptySlot（那是"允许合并但优先给空位"）。
    if (IsMachineContainer(ctx.slotInventory))
    {
        if (ConsumeJudgeFault(FaultProtection))
        { WarnPolicyFault("mp.fault.machine", true); return MergeVerdict.Deny; }
        reason = "机器容器内不允许堆叠";
        return MergeVerdict.Deny;
    }
    if (ConsumeJudgeFault(FaultProtection))
    { WarnPolicyFault("mp.fault.machine", true); return MergeVerdict.Deny; }


    // ══════════════════════════════════════════════════════════════════════
    //  文件 3：StackPatches.Value.cs —— MaxNumAdd 机器容器钳制
    //  ★ 插入点：Patch_MaxNumAdd.Postfix 内，`if (slot == null) return;` 之后
    // ══════════════════════════════════════════════════════════════════════

    private static void Postfix(GameItem __instance, SlotMarker slot, ref int __result)
    {
        try
        {
            if (slot == null) return;   // 无参转发路径（slot 未构造）不动

            // ★ 机器容器：空位或已有堆都只放 1 件
            //   必要性：MayStack Deny 只阻止"合并到已有堆"；
            //           若此处不钳制，空位分支会走 StackCap 一次放多件。
            //   两层互补的完整论证见方案 v2 §二 layer_necessity。
            if (IsMachineContainer(slot.inventory))
            {
                if (__result != 1)
                {
                    LogOnce("machine.add." + SafeId(__instance), Level.Diag,
                        $"机器容器内 MaxNumAdd 钳到 1：{SafeId(__instance)}（原 {__result}）",
                        max: 3);
                    __result = 1;
                }
                return;   // 早返回，不改动普通容器逻辑
            }

            // ── 以下为原逻辑（普通容器）──
            int before = __result;
            var target = slot.targetItem;
            if (target != null)
            {
                int want = StackCap - target.unitCount;
                if (want > __result) __result = want;
                LogOnce("maxnumadd.stack." + SafeId(__instance) + "/" + SafeId(target),
                    Level.Diag,
                    $"MaxNumAdd {__instance.identifier} -> 目标堆 {target.identifier}：{before} -> {__result}（目标 unitCount={target.unitCount}，StackCap={StackCap}）",
                    max: 3);
            }
            else if (__result < StackCap)
            {
                int want = StackCap;
                if (want > __result) __result = want;
                LogOnce("maxnumadd.empty." + SafeId(__instance), Level.Diag,
                    $"MaxNumAdd {__instance.identifier} -> 空槽：{before} -> {__result}（unitCount={__instance.unitCount}，StackCap={StackCap}）",
                    max: 3);
            }
        }
        catch (Exception e)
        {
            Log.Error($"MaxNumAdd postfix 异常: {e}");
        }
    }